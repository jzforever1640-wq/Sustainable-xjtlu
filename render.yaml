services:
  - type: web
    name: sustainable-xjtlu-api
    runtime: python
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    preDeployCommand: flask --app wsgi:app db upgrade
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 2 wsgi:app
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.12
      - key: DATABASE_URL
        fromDatabase:
          name: sustainable-xjtlu-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: https://sustainable-xjtlu-10.vercel.app

databases:
  - name: sustainable-xjtlu-db
    databaseName: sustainable_xjtlu
    user: sustainable_xjtlu
    region: singapore
    plan: free
